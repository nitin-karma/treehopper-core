[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "treehopperai-core"
version = "0.1.0"
description = "TreehopperAI: is a local-first, agent-centric, fully open-source automation framework for building intelligent workflows — from edge AI agents to orchestrated micro-services and distributed chains"
readme = "README.md"
authors = [
    { name = "Nitin Kumar Karma", email = "developer@example.com" }
]
license = { file = "LICENSE" }
requires-python = ">=3.10"  # ✅ Requires Python 3.10+

dependencies = [
    "fastapi>=0.110,<0.115",
    "uvicorn>=0.20,<0.31",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pydantic>=2.3,<3.0",
    "openai>=1.0",
    "anthropic>=0.20",
    "google-generativeai>=0.4",
    "tiktoken>=0.6",
    "chromadb>=1.4.0",
    "pyyaml",
    "tabulate",
    "websocket-client",
    "PyMuPDF"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[project.urls]
Homepage = "https://github.com/nitin-karma/treehopper-core"
Issues = "https://github.com/nitin-karma/treehopper-core/issues"

[project.scripts]
treehopper = "treehopper.treehopper_cli:main"
th = "treehopper.treehopper_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["treehopper*"]

[tool.setuptools.package-data]
treehopper = [
    "agents/*.py",
    "*.json",
    "*.yaml",
    "*.yml",
    "logo/*",
    "static/*",
    "templates/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-vv --disable-warnings --maxfail=1"
asyncio_mode = "auto"
env = [
    "TH_TEST_MODE=1",
    "PYTEST_CURRENT_TEST=1"
]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests"
]

# -------------------------------------------------------
# ✅ Mypy configuration - FIXED to match requires-python
# -------------------------------------------------------
[tool.mypy]
python_version = "3.10"  # ✅ CHANGED from "3.9" to "3.10" to match requires-python
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false

# Exclude pattern using regex - note the double backslash
exclude = '''(?x)(
    ^tests/unit/conftest\.py$
    | ^tests/integration/conftest\.py$
    | ^tests/.*/conftest\.py$
)'''

# Per-module overrides as backup
[[tool.mypy.overrides]]
module = "conftest"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
