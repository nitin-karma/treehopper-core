name: TreehopperAI CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # -----------------------------
      # Treehopper runtime controls
      # -----------------------------
      TREEHOPPER_RUNTIME_MODE: "1"
      TREEHOPPER_FORCE_LOCAL: "1"
      TREEHOPPER_API_KEY: "demo-key-123"

      # -----------------------------
      # 🔒 CI-SAFE LLM CONFIG
      # -----------------------------
      TH_TEST_MODE: "1"
      TH_LLM_PROVIDER: "mock"

      # Prevent accidental vendor calls
      OPENAI_API_KEY: ""
      PERPLEXITY_API_KEY: ""
      GEMINI_API_KEY: ""

    steps:
      # ----------------------------------
      # Checkout
      # ----------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------
      # Python
      # ----------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ----------------------------------
      # Install
      # ----------------------------------
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-asyncio requests websocket-client jq

      # ----------------------------------
      # 1️⃣ UNIT TESTS
      # ----------------------------------
      - name: Run unit tests
        run: |
          pytest tests/unit

      # ----------------------------------
      # 2️⃣ INTEGRATION TESTS
      # ----------------------------------
      - name: Run integration tests
        run: |
          pytest tests/integration

      # ----------------------------------
      # 3️⃣ REAL E2E SMOKE TEST
      # ----------------------------------
      - name: Run REAL E2E (runtime smoke)
        run: |
          chmod +x ./scripts/e2e_smoke_treehopper_full.sh
          ./scripts/e2e_smoke_treehopper_full.sh
