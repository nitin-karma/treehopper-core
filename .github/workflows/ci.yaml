name: TreehopperAI CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      TREEHOPPER_RUNTIME_MODE: "1"
      TREEHOPPER_FORCE_LOCAL: "1"
      TREEHOPPER_API_KEY: "demo-key-123"
      TH_TEST_MODE: "1"
      TH_LLM_PROVIDER: "mock"
      OPENAI_API_KEY: ""
      PERPLEXITY_API_KEY: ""
      GEMINI_API_KEY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ----------------------------------
      # Install Treehopper
      # ----------------------------------
      - name: Install Treehopper (editable)
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Install test dependencies
        run: |
          pip install -e ".[test]"

      # ----------------------------------
      # Linting & Type Checks
      # ----------------------------------
      - name: Run Black (formatting check)
        run: |
          pip install black
          black --check treehopper/

      - name: Run Flake8 (linting)
        run: |
          pip install flake8
          flake8 treehopper/ --max-line-length=250

      - name: Run Mypy (type checking)
        run: |
          pip install mypy types-PyYAML types-requests types-setuptools types-tabulate
          mypy treehopper/ --python-version=3.10 --ignore-missing-imports --install-types --non-interactive
        continue-on-error: true

      # ----------------------------------
      # Tests
      # ----------------------------------
      - name: Run unit tests
        run: |
          pytest tests/unit -v

      - name: Run integration tests
        run: |
          pytest tests/integration -v

      # ----------------------------------
      # E2E Smoke Test (non-blocking)
      # ----------------------------------
      - name: Run E2E smoke test
        run: |
          chmod +x scripts/e2e_smoke_treehopper_full.sh
          ./scripts/e2e_smoke_treehopper_full.sh
        continue-on-error: true
