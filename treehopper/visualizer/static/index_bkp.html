<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/static/favicon.ico">
  <title>TreehopperAI Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
      padding: 25px 30px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.1);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .logo {
      height: 50px;
      width: auto;
      border-radius: 8px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 600;
      color: #10b981;
      letter-spacing: -0.5px;
    }

    .theme-toggle {
      margin-left: auto;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-toggle:hover {
      background: rgba(16, 185, 129, 0.2);
      transform: scale(1.05);
    }

    .status-badge {
      padding: 8px 16px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 20px;
      color: #10b981;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 25px;
      border: 1px solid rgba(148, 163, 184, 0.1);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-icon {
      font-size: 20px;
    }

    .card-count {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: #10b981;
    }

    .list-container {
      max-height: 350px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .list-container::-webkit-scrollbar {
      width: 6px;
    }

    .list-container::-webkit-scrollbar-track {
      background: rgba(148, 163, 184, 0.05);
      border-radius: 3px;
    }

    .list-container::-webkit-scrollbar-thumb {
      background: rgba(16, 185, 129, 0.3);
      border-radius: 3px;
    }

    .list-container::-webkit-scrollbar-thumb:hover {
      background: rgba(16, 185, 129, 0.5);
    }

    .list-item {
      background: rgba(30, 41, 59, 0.5);
      padding: 14px 16px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.08);
      transition: all 0.2s;
    }

    .list-item:hover {
      background: rgba(30, 41, 59, 0.8);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .list-item-name {
      font-weight: 500;
      color: #f1f5f9;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .list-item-id {
      font-size: 12px;
      color: #94a3b8;
      font-family: 'Courier New', monospace;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .logs-card {
      grid-column: 1 / -1;
    }

    .log-entry {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      padding: 8px 12px;
      margin-bottom: 6px;
      background: rgba(30, 41, 59, 0.5);
      border-radius: 6px;
      border-left: 3px solid #64748b;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .log-entry.error {
      border-left-color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }

    .log-entry.warning {
      border-left-color: #f59e0b;
      background: rgba(245, 158, 11, 0.1);
    }

    .log-entry.success {
      border-left-color: #10b981;
      background: rgba(16, 185, 129, 0.1);
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .metric-item {
      background: rgba(30, 41, 59, 0.5);
      padding: 16px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.08);
      text-align: center;
    }

    .metric-value {
      font-size: 28px;
      font-weight: 700;
      color: #10b981;
      margin-bottom: 6px;
    }

    .metric-label {
      font-size: 13px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .pid-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(30, 41, 59, 0.5);
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.08);
    }

    .pid-name {
      font-weight: 500;
      color: #f1f5f9;
      font-size: 14px;
    }

    .pid-value {
      font-family: 'Courier New', monospace;
      color: #10b981;
      font-size: 13px;
      background: rgba(16, 185, 129, 0.1);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #64748b;
      font-size: 14px;
    }

    .refresh-button {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .refresh-button:hover {
      background: rgba(16, 185, 129, 0.2);
      transform: scale(1.05);
    }

    .refresh-button:active {
      transform: scale(0.95);
    }

    /* Light Mode Styles */
    body.light-mode {
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      color: #1e293b;
    }

    body.light-mode .header {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    body.light-mode .header h1 {
      color: #059669;
    }

    body.light-mode .status-badge,
    body.light-mode .theme-toggle,
    body.light-mode .refresh-button {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #059669;
    }

    body.light-mode .card {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    body.light-mode .card-title {
      color: #1e293b;
    }

    body.light-mode .card-count {
      background: rgba(16, 185, 129, 0.1);
      color: #059669;
    }

    body.light-mode .list-item,
    body.light-mode .pid-item,
    body.light-mode .metric-item {
      background: rgba(241, 245, 249, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.15);
    }

    body.light-mode .list-item:hover {
      background: rgba(226, 232, 240, 0.9);
      border-color: rgba(16, 185, 129, 0.4);
    }

    body.light-mode .list-item-name,
    body.light-mode .pid-name {
      color: #1e293b;
    }

    body.light-mode .list-item-id {
      color: #64748b;
    }

    body.light-mode .pid-value {
      color: #059669;
      background: rgba(16, 185, 129, 0.1);
    }

    body.light-mode .metric-value {
      color: #059669;
    }

    body.light-mode .metric-label {
      color: #64748b;
    }

    body.light-mode .log-entry {
      background: rgba(241, 245, 249, 0.8);
      border-left: 3px solid #64748b;
      color: #334155;
    }

    body.light-mode .card-header {
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
    }

    body.light-mode .list-container::-webkit-scrollbar-track {
      background: rgba(148, 163, 184, 0.1);
    }

    body.light-mode .list-container::-webkit-scrollbar-thumb {
      background: rgba(16, 185, 129, 0.4);
    }

    body.light-mode .empty-state {
      color: #64748b;
    }

    body.light-mode .loading {
      color: #64748b;
    }

    /* Log Table Styles */
    .search-container {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
    }

    .search-input {
      flex: 1;
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      padding: 10px 16px;
      color: #e2e8f0;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s;
    }

    .search-input:focus {
      outline: none;
      border-color: rgba(16, 185, 129, 0.5);
      background: rgba(30, 41, 59, 0.7);
    }

    body.light-mode .search-input {
      background: rgba(241, 245, 249, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: #1e293b;
    }

    body.light-mode .search-input:focus {
      background: rgba(255, 255, 255, 0.9);
      border-color: rgba(16, 185, 129, 0.5);
    }

    .log-table-container {
      overflow-x: auto;
      max-height: 400px;
      overflow-y: auto;
    }

    .log-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 13px;
    }

    .log-table thead {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
    }

    body.light-mode .log-table thead {
      background: rgba(255, 255, 255, 0.95);
    }

    .log-table th {
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
      color: #10b981;
      border-bottom: 2px solid rgba(16, 185, 129, 0.3);
      white-space: nowrap;
    }

    body.light-mode .log-table th {
      color: #059669;
    }

    .log-table td {
      padding: 10px 16px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
      color: #cbd5e1;
    }

    body.light-mode .log-table td {
      color: #334155;
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    }

    .log-table tbody tr {
      background: rgba(30, 41, 59, 0.3);
      transition: all 0.2s;
    }

    .log-table tbody tr:hover {
      background: rgba(30, 41, 59, 0.6);
    }

    body.light-mode .log-table tbody tr {
      background: rgba(241, 245, 249, 0.4);
    }

    body.light-mode .log-table tbody tr:hover {
      background: rgba(226, 232, 240, 0.6);
    }

    .log-table tbody tr.error {
      background: rgba(239, 68, 68, 0.1);
      border-left: 3px solid #ef4444;
    }

    .log-table tbody tr.warning {
      background: rgba(245, 158, 11, 0.1);
      border-left: 3px solid #f59e0b;
    }

    .log-table tbody tr.success {
      background: rgba(16, 185, 129, 0.1);
      border-left: 3px solid #10b981;
    }

    .log-level {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .log-level.error {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    .log-level.warning {
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
    }

    .log-level.success,
    .log-level.info {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
    }

    body.light-mode .log-level.error {
      background: rgba(239, 68, 68, 0.15);
      color: #dc2626;
    }

    body.light-mode .log-level.warning {
      background: rgba(245, 158, 11, 0.15);
      color: #d97706;
    }

    body.light-mode .log-level.success,
    body.light-mode .log-level.info {
      background: rgba(16, 185, 129, 0.15);
      color: #059669;
    }

    .log-timestamp {
      font-family: 'Courier New', monospace;
      color: #94a3b8;
      white-space: nowrap;
    }

    .log-logger {
      font-family: 'Courier New', monospace;
      color: #64748b;
    }

    .log-message {
      font-family: 'Courier New', monospace;
      word-break: break-word;
    }

    .no-results {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="/static/treehopper_logo.png" alt="TreehopperAI Logo" class="logo">
      <h1>TreehopperAI Dashboard</h1>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
        <span id="themeIcon">☀️</span>
      </button>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span id="statusText">Connecting...</span>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <span class="card-icon">🤖</span>
            Agents
          </div>
          <span class="card-count" id="agentCount">0</span>
        </div>
        <div class="list-container" id="agentsList">
          <div class="loading">Loading agents...</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <span class="card-icon">⛓️</span>
            Chains
          </div>
          <span class="card-count" id="chainCount">0</span>
        </div>
        <div class="list-container" id="chainsList">
          <div class="loading">Loading chains...</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <span class="card-icon">⚙️</span>
            Processes
          </div>
          <span class="card-count" id="pidCount">0</span>
        </div>
        <div class="list-container" id="pidsList">
          <div class="loading">Loading processes...</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <span class="card-icon">📊</span>
            Metrics
          </div>
          <button class="refresh-button" onclick="loadMetrics()">Refresh</button>
        </div>
        <div id="metricsContainer">
          <div class="loading">Loading metrics...</div>
        </div>
      </div>
    </div>

    <div class="card logs-card">
      <div class="card-header">
        <div class="card-title">
          <span class="card-icon">📝</span>
          System Logs
        </div>
        <button class="refresh-button" onclick="loadLogs()">Refresh</button>
      </div>
      <div class="search-container">
        <input
          type="text"
          class="search-input"
          id="logSearch"
          placeholder="Search logs by timestamp, level, logger, or message..."
          oninput="filterLogs()"
        >
      </div>
      <div class="log-table-container" id="logsContainer">
        <div class="loading">Loading logs...</div>
      </div>
    </div>
  </div>

  <script>
    let updateInterval;
    let allLogs = [];

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      const themeIcon = document.getElementById('themeIcon');
      const isLight = document.body.classList.contains('light-mode');
      themeIcon.textContent = isLight ? '🌙' : '☀️';
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    }

    function loadTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.body.classList.add('light-mode');
        document.getElementById('themeIcon').textContent = '🌙';
      }
    }

    async function loadState() {
      try {
        const response = await fetch('/api/state');
        const data = await response.json();

        document.getElementById('statusText').textContent = 'Online';

        // Update agents
        const agentsList = document.getElementById('agentsList');
        const agentCount = document.getElementById('agentCount');
        if (data.agents && data.agents.length > 0) {
          agentsList.innerHTML = data.agents.map(agent => `
            <div class="list-item">
              <div class="list-item-name">${agent.name || 'Unknown'}</div>
              <div class="list-item-id">${agent.id || 'N/A'}</div>
            </div>
          `).join('');
          agentCount.textContent = data.agents.length;
        } else {
          agentsList.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🤖</div><div>No agents found</div></div>';
          agentCount.textContent = '0';
        }

        // Update chains
        const chainsList = document.getElementById('chainsList');
        const chainCount = document.getElementById('chainCount');
        if (data.chains && data.chains.length > 0) {
          chainsList.innerHTML = data.chains.map(chain => `
            <div class="list-item">
              <div class="list-item-name">${chain.name || 'Unknown'}</div>
              <div class="list-item-id">${chain.id || 'N/A'}</div>
            </div>
          `).join('');
          chainCount.textContent = data.chains.length;
        } else {
          chainsList.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⛓️</div><div>No chains found</div></div>';
          chainCount.textContent = '0';
        }

        // Update PIDs
        const pidsList = document.getElementById('pidsList');
        const pidCount = document.getElementById('pidCount');
        if (data.pids && Object.keys(data.pids).length > 0) {
          pidsList.innerHTML = Object.entries(data.pids).map(([name, pid]) => `
            <div class="pid-item">
              <span class="pid-name">${name}</span>
              <span class="pid-value">${pid}</span>
            </div>
          `).join('');
          pidCount.textContent = Object.keys(data.pids).length;
        } else {
          pidsList.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚙️</div><div>No processes found</div></div>';
          pidCount.textContent = '0';
        }
      } catch (error) {
        console.error('Error loading state:', error);
        document.getElementById('statusText').textContent = 'Error';
      }
    }

    async function loadMetrics() {
      try {
        const response = await fetch('/api/metrics');
        const data = await response.json();

        const metricsContainer = document.getElementById('metricsContainer');
        if (data && Object.keys(data).length > 0) {
          metricsContainer.innerHTML = '<div class="metrics-grid">' +
            Object.entries(data).map(([key, value]) => `
              <div class="metric-item">
                <div class="metric-value">${value}</div>
                <div class="metric-label">${key.replace(/_/g, ' ')}</div>
              </div>
            `).join('') + '</div>';
        } else {
          metricsContainer.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div><div>No metrics available</div></div>';
        }
      } catch (error) {
        console.error('Error loading metrics:', error);
        document.getElementById('metricsContainer').innerHTML = '<div class="empty-state">Error loading metrics</div>';
      }
    }


    function renderLogs(logs) {
    const logsContainer = document.getElementById('logsContainer');

    if (!logs || logs.length === 0) {
        logsContainer.innerHTML = '<div class="no-results">No logs match your search</div>';
        return;
    }

    let tableHTML = `
        <table class="log-table">
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Level</th>
                    <th>Logger</th>
                    <th>Message</th>
                </tr>
            </thead>
            <tbody>
    `;

    logs.forEach(log => {
        const levelClass = log.level.toLowerCase();
        const rowClass = ['error', 'warning', 'success'].includes(levelClass) ? levelClass : '';

        tableHTML += `
            <tr class="${rowClass}">
                <td class="log-timestamp">${log.timestamp}</td>
                <td><span class="log-level ${levelClass}">${log.level}</span></td>
                <td class="log-logger">${escapeHtml(log.logger)}</td>
                <td class="log-message">${escapeHtml(log.message)}</td>
            </tr>
        `;
    });

    tableHTML += `
            </tbody>
        </table>
    `;

    logsContainer.innerHTML = tableHTML;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
    async function loadLogs() {
    try {
        const response = await fetch('/api/logs');
        const data = await response.json();

        const logsContainer = document.getElementById('logsContainer');
        if (!logsContainer) return;

        if (data && Array.isArray(data) && data.length > 0) {
            allLogs = data.map(log => {
                // Parse timestamp
                let timestamp = '-';
                if (log.ts) {
                    // If log.ts is a number (Unix timestamp in seconds), multiply by 1000
                    // If it's already a string like "2024-...", it will work as is
                    const tsValue = typeof log.ts === 'number' && log.ts < 10000000000 ? log.ts * 1000 : log.ts;
                    const date = new Date(tsValue);

                    if (!isNaN(date.getTime())) {
                        timestamp = date.getFullYear() + '-' +
                            String(date.getMonth() + 1).padStart(2, '0') + '-' +
                            String(date.getDate()).padStart(2, '0') + ' ' +
                            String(date.getHours()).padStart(2, '0') + ':' +
                            String(date.getMinutes()).padStart(2, '0') + ':' +
                            String(date.getSeconds()).padStart(2, '0');
                    } else {
                        timestamp = log.ts;
                    }
                }

                const level = log.level || 'INFO';
                const logger = log.logger || '-';
                const message = log.msg || (typeof log === 'string' ? log : JSON.stringify(log));

                return { timestamp, level, logger, message };
            });
            // Only re-render if the user isn't currently typing in the search box
            const searchInput = document.getElementById('logSearch');
            if (!searchInput.value) {
                renderLogs(allLogs);
            } else {
                filterLogs(); // Re-apply current filter to new data
            }
                        renderLogs(allLogs);
        } else if (typeof data === 'string') {
            allLogs = [{
                timestamp: new Date().toISOString(),
                level: 'INFO',
                logger: 'system',
                message: data
            }];
            renderLogs(allLogs);
        } else {
            logsContainer.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📝</div><div>No logs available</div></div>';
            allLogs = [];
        }
    } catch (error) {
        console.error('Error loading logs:', error);
        const container = document.getElementById('logsContainer');
        if (container) {
            container.innerHTML = '<div class="empty-state">Error loading logs</div>';
        }
        allLogs = [];
    }
}

    function filterLogs() {
        const searchTerm = document.getElementById('logSearch').value.toLowerCase();

        // If search is empty, show all logs
        if (!searchTerm) {
            renderLogs(allLogs);
            return;
        }

        // Filter logs based on all four columns
        const filtered = allLogs.filter(log => {
            return (
                log.timestamp.toLowerCase().includes(searchTerm) ||
                log.level.toLowerCase().includes(searchTerm) ||
                log.logger.toLowerCase().includes(searchTerm) ||
                log.message.toLowerCase().includes(searchTerm)
            );
        });

        renderLogs(filtered);
    }

    function init() {
      loadTheme();
      loadState();
      loadMetrics();
      loadLogs();

      // Auto-refresh every 5 seconds
      updateInterval = setInterval(() => {
        loadState();
      }, 5000);
    }

    // Initialize on load
    init();
  </script>
</body>
